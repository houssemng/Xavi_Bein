<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeinXavi — Live Football</title>
  <meta name="description" content="BeinXavi — Championship Hub | Global Sports Streams" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00C853;
      --dark: #0a0f0d;
      --card: #121a14;
      --card2: #1a2420;
      --border: rgba(0,200,83,0.15);
      --text: #e8f5e9;
      --muted: #7a9e82;
      --live: #ff3d3d;
      --radius: 10px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: #0d1410;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .logo-img {
      height: 42px;
      width: 42px;
      object-fit: contain;
      border-radius: 6px;
    }
    .live-badge {
      background: var(--live);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: pulse-badge 1.5s infinite;
    }
    @keyframes pulse-badge { 0%,100%{opacity:1}50%{opacity:0.6} }
    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
      justify-content: flex-end;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }
    nav button.active, nav button:hover {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      font-weight: 600;
    }

    /* MAIN */
    main { padding: 20px 16px; max-width: 1200px; margin: 0 auto; }

    /* PLAYER */
    #player-section {
      display: none;
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #player-section.visible { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)} }
    .player-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--card2);
    }
    .player-match-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-close {
      background: transparent;
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff6b6b;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
      min-height: 34px;
    }
    .player-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }
    .player-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .player-loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #050907;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .stream-tabs {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #0f1a12;
      border-top: 1px solid var(--border);
    }
    .stream-tab {
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      min-height: 34px;
    }
    .stream-tab:hover { border-color: var(--green); color: var(--text); }
    .stream-tab.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 600; }
    .hd-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* SECTION TITLE */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* GRID */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    /* MATCH CARD — clean horizontal layout */
    .match-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .match-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .match-card:hover { border-color: rgba(0,200,83,0.4); transform: translateY(-2px); }
    .match-card:hover::before { opacity: 1; }
    .match-card:active { transform: scale(0.98); }
    .match-card.is-live { border-color: rgba(255,61,61,0.3); }
    .match-card.is-live::before { background: linear-gradient(90deg, var(--live), transparent); opacity: 1; }

    /* top row: competition + status */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-competition {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .card-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .status-live { background: rgba(255,61,61,0.15); color: var(--live); border: 1px solid rgba(255,61,61,0.3); }
    .status-soon { background: rgba(0,200,83,0.1); color: var(--green); border: 1px solid rgba(0,200,83,0.2); }

    /* teams: badge + name side by side, VS in centre */
    .teams-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .team.away { flex-direction: row-reverse; }
    .badge-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .badge-wrap img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .badge-initials {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
      line-height: 1;
    }
    .team-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .team.away .team-name { text-align: right; }
    .vs-divider {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
      padding: 0 2px;
    }

    /* watch button */
    .watch-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(0,200,83,0.25);
      color: var(--green);
      padding: 9px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
    }
    .watch-btn:hover, .watch-btn:active { background: var(--green); color: #000; border-color: var(--green); }

    /* EMPTY / SKELETON */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      line-height: 1.7;
    }
    .skeleton {
      background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
      height: 130px;
    }
    @keyframes shimmer { to{background-position:-200% 0} }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 28px 16px 20px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 36px;
    }
    footer a { color: var(--green); text-decoration: none; }

    /* MOBILE ≤480px */
    @media (max-width: 480px) {
      header { flex-wrap: wrap; height: auto; padding: 10px 14px; gap: 8px; }
      nav { justify-content: flex-start; flex: 0 0 100%; padding-bottom: 2px; }
      nav button { font-size: 11px; padding: 5px 11px; }
      main { padding: 14px 12px; }
      .matches-grid { grid-template-columns: 1fr; gap: 10px; }
    }
    /* TABLET 481–768px */
    @media (min-width: 481px) and (max-width: 768px) {
      .matches-grid { grid-template-columns: repeat(2, 1fr); }
    }
    /* LANDSCAPE PHONE */
    @media (max-width: 768px) and (orientation: landscape) {
      .player-wrap { padding-bottom: 45%; }
    }
  </style>
</head>

  return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function isLive(match) {
  const now = Date.now();
  return now >= match.date && now <= match.date + 2*60*60*1000;
}

async function fetchMatches(filter) {
  const ep = filter === 'live' ? 'live' : filter === 'today' ? 'all-today' : 'football';
  try {
    const r = await fetch(`${BASE}/matches/${ep}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (filter === 'all') return data.filter(m => m.category === 'football');
    return data;
  } catch(e) { return []; }
}

async function loadStreams(match) {
  if (!match.sources || !match.sources.length) return [];
  const results = [];
  for (const src of match.sources.slice(0, 3)) {
    try {
      const r = await fetch(`${BASE}/stream/${src.source}/${src.id}`);
      if (!r.ok) continue;
      const streams = await r.json();
      if (Array.isArray(streams)) results.push(...streams);
    } catch(e) {}
  }
  return results;
}

// Safe badge: creates DOM elements, zero risk of innerHTML injection
function makeBadgeWrap(badge, name) {
  const wrap = document.createElement('div');
  wrap.className = 'badge-wrap';
  if (badge) {
    const img = document.createElement('img');
    img.alt = name || '';
    img.src = `${IMG}/badge/${badge}.webp`;
    img.onerror = () => {
      img.remove();
      const span = document.createElement('span');
      span.className = 'badge-initials';
      span.textContent = initials(name);
      wrap.appendChild(span);
    };
    wrap.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'badge-initials';
    span.textContent = initials(name);
    wrap.appendChild(span);
  }
  return wrap;
}

function makeCard(match) {
  const live = isLive(match);
  const home = match.teams?.home;
  const away = match.teams?.away;
  const homeName = home?.name || (match.title?.includes(' vs ') ? match.title.split(' vs ')[0] : 'Home');
  const awayName = away?.name || (match.title?.includes(' vs ') ? match.title.split(' vs ')[1] : 'Away');

  const card = document.createElement('div');
  card.className = 'match-card' + (live ? ' is-live' : '');

  // top row
  const top = document.createElement('div');
  top.className = 'card-top';
  const comp = document.createElement('span');
  comp.className = 'card-competition';
  comp.textContent = match.category || 'Football';
  const status = document.createElement('span');
  status.className = 'card-status ' + (live ? 'status-live' : 'status-soon');
  status.textContent = live ? '● LIVE' : formatTime(match.date);
  top.appendChild(comp);
  top.appendChild(status);

  // teams row
  const teamsRow = document.createElement('div');
  teamsRow.className = 'teams-row';

  const homeDiv = document.createElement('div');
  homeDiv.className = 'team home';
  homeDiv.appendChild(makeBadgeWrap(home?.badge, homeName));
  const homeNameEl = document.createElement('div');
  homeNameEl.className = 'team-name';
  homeNameEl.textContent = homeName;
  homeDiv.appendChild(homeNameEl);

  const vsEl = document.createElement('div');
  vsEl.className = 'vs-divider';
  vsEl.textContent = 'VS';

  const awayDiv = document.createElement('div');
  awayDiv.className = 'team away';
  awayDiv.appendChild(makeBadgeWrap(away?.badge, awayName));
  const awayNameEl = document.createElement('div');
  awayNameEl.className = 'team-name';
  awayNameEl.textContent = awayName;
  awayDiv.appendChild(awayNameEl);

  teamsRow.appendChild(homeDiv);
  teamsRow.appendChild(vsEl);
  teamsRow.appendChild(awayDiv);

  // watch button
  const btn = document.createElement('button');
  btn.className = 'watch-btn';
  btn.innerHTML = '▶ Watch Now';
  btn.onclick = (e) => { e.stopPropagation(); openMatch(match); };

  card.appendChild(top);
  card.appendChild(teamsRow);
  card.appendChild(btn);
  card.onclick = () => openMatch(match);

  return card;
}

async function openMatch(match) {
  const ps      = document.getElementById('player-section');
  const iframe  = document.getElementById('main-iframe');
  const loading = document.getElementById('player-loading');
  const tabs    = document.getElementById('stream-tabs');

  document.getElementById('player-title').textContent = match.title || 'Match';
  iframe.src = '';
  loading.style.display = 'flex';
  loading.innerHTML = '<div class="spinner"></div><span>Loading stream…</span>';
  tabs.innerHTML = '<span style="color:var(--muted);font-size:12px">Loading streams…</span>';
  ps.className = 'visible';
  ps.scrollIntoView({behavior:'smooth', block:'start'});

  const streams = await loadStreams(match);
  tabs.innerHTML = '';

  if (!streams.length) {
    tabs.innerHTML = '<span style="color:var(--muted);font-size:12px">No streams available yet. Try again when the match is live.</span>';
    loading.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:20px">No stream available</div>';
    return;
  }

  streams.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'stream-tab' + (i === 0 ? ' active' : '');
    btn.innerHTML = `Stream ${s.streamNo || i+1} · ${s.language || 'EN'}${s.hd ? '<span class="hd-dot"></span>' : ''}`;
    btn.onclick = () => {
      document.querySelectorAll('.stream-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      iframe.src = '';
      loading.style.display = 'flex';
      loading.innerHTML = '<div class="spinner"></div><span>Loading stream…</span>';
      iframe.src = s.embedUrl;
    };
    tabs.appendChild(btn);
  });

  iframe.src = streams[0].embedUrl;
}

function closePlayer() {
  document.getElementById('player-section').className = '';
  document.getElementById('main-iframe').src = '';
}

async function setFilter(filter, btn) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {live:'Live Matches', today:"Today's Matches", all:'All Football Matches'};
  document.getElementById('section-label').textContent = labels[filter];
  const grid = document.getElementById('matches-grid');
  grid.innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');

  const matches = await fetchMatches(filter);

  grid.innerHTML = '';

  if (!matches.length) {
    grid.innerHTML = '<div class="empty-state">⚽<br><br>No matches found right now.<br>Try "Today" or "All Football".</div>';
    return;
  }

  matches.slice(0, 24).forEach(m => grid.appendChild(makeCard(m)));
}

setFilter('live', document.querySelector('nav button.active'));
</script>

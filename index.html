<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoalStream — Live Football Streaming</title>
  <meta name="description" content="Watch live football matches online. Stream Premier League, Champions League, La Liga and more for free on GoalStream." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    /* ─── Reset & Tokens ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #00C853;
      --green-dim:  #009c40;
      --dark:       #080d0a;
      --surface:    #101710;
      --card:       #131c15;
      --card2:      #1a2820;
      --border:     rgba(0, 200, 83, 0.12);
      --border-hov: rgba(0, 200, 83, 0.35);
      --text:       #e6f4ea;
      --muted:      #6e9478;
      --live:       #ff3d3d;
      --radius:     12px;
      --radius-sm:  8px;
      --header-h:   58px;
      --transition: 0.2s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    /* ─── Header ─────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(8, 13, 10, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: var(--header-h);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* Logo */
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-decoration: none;
    }
    .logo .logo-word { color: var(--text); }

    .live-badge {
      background: var(--live);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    /* Desktop nav */
    .nav-pills {
      display: flex;
      gap: 6px;
    }
    .nav-pills button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .nav-pills button:hover,
    .nav-pills button.active {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      font-weight: 700;
    }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* Mobile drawer */
    .mobile-nav {
      display: none;
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      flex-direction: column;
      gap: 8px;
      z-index: 199;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .mobile-nav.open { display: flex; }
    .mobile-nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      transition: all var(--transition);
    }
    .mobile-nav button.active,
    .mobile-nav button:hover {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      font-weight: 700;
    }

    /* ─── Main Layout ─────────────────────────────────── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    /* ─── Player Section ─────────────────────────────── */
    #player-section {
      display: none;
      margin-bottom: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #player-section.visible {
      display: block;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

    .player-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
    }
    .player-match-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-close {
      background: transparent;
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff6b6b;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .player-close:hover { background: rgba(255,60,60,0.12); }

    /* 16:9 responsive player */
    .player-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }
    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #050907;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stream-tabs {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #0c1510;
      border-top: 1px solid var(--border);
    }
    .stream-tab {
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all var(--transition);
    }
    .stream-tab:hover { border-color: var(--green); color: var(--text); }
    .stream-tab.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 700; }
    .hd-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-left: 5px;
      vertical-align: middle;
    }
    .stream-tab.active .hd-dot { background: #000; }

    /* ─── Section Title ───────────────────────────────── */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ─── Matches Grid ────────────────────────────────── */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    /* ─── Match Card ──────────────────────────────────── */
    .match-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* top accent bar */
    .match-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .match-card:hover {
      border-color: var(--border-hov);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,200,83,0.08);
    }
    .match-card:hover::before { opacity: 1; }
    .match-card.is-live { border-color: rgba(255,61,61,0.25); }
    .match-card.is-live::before { background: linear-gradient(90deg, var(--live), transparent); opacity: 1; }

    /* Card top row */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-competition {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .card-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .status-live { background: rgba(255,61,61,0.12); color: var(--live); border: 1px solid rgba(255,61,61,0.28); }
    .status-soon { background: rgba(0,200,83,0.08); color: var(--green); border: 1px solid rgba(0,200,83,0.2); }

    /* Teams */
    .teams-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      flex: 1;
    }
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .team-badge,
    .team-badge-placeholder {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .team-badge { object-fit: contain; padding: 4px; }
    .team-badge-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      color: var(--muted);
    }
    .team-name {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }
    .vs-divider {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      color: var(--muted);
      flex-shrink: 0;
      padding: 0 4px;
    }

    /* Watch button */
    .watch-btn {
      width: 100%;
      margin-top: 4px;
      background: transparent;
      border: 1px solid rgba(0,200,83,0.25);
      color: var(--green);
      padding: 9px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .watch-btn:hover { background: var(--green); color: #000; border-color: var(--green); }
    .watch-btn i { font-size: 14px; }

    /* ─── Empty / Skeleton ───────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; opacity: 0.25; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    .skel-card {
      height: 168px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ─── Footer ─────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 28px 20px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 32px;
    }
    footer a { color: var(--green); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ─── Responsive ─────────────────────────────────── */

    /* Tablet (≤ 768px) */
    @media (max-width: 768px) {
      .nav-pills { display: none; }
      .menu-toggle { display: flex; }

      main { padding: 18px 16px 36px; }

      .matches-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }

      .player-match-title { font-size: 15px; }
    }

    /* Mobile (≤ 500px) */
    @media (max-width: 500px) {
      .header-inner { padding: 0 14px; }
      .logo { font-size: 24px; }

      main { padding: 14px 12px 32px; }

      .matches-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .match-card { padding: 12px; }
      .team-badge, .team-badge-placeholder { width: 38px; height: 38px; }
      .team-name { font-size: 11px; }
      .watch-btn { font-size: 11px; padding: 8px; }

      .stream-tabs { padding: 10px 12px; gap: 6px; }
      .stream-tab { font-size: 11px; padding: 4px 10px; }
    }

    /* Very small (≤ 360px) */
    @media (max-width: 360px) {
      .matches-grid { grid-template-columns: 1fr; }
    }

    /* Large screens */
    @media (min-width: 1100px) {
      .matches-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<h1 class="sr-only">GoalStream — Live Football Match Streaming</h1>

<header>
  <div class="header-inner">
    <a href="#" class="logo" aria-label="GoalStream Home">
      Goal<span class="logo-word">Stream</span>
      <span class="live-badge" aria-label="Live">LIVE</span>
    </a>

    <!-- Desktop nav -->
    <nav class="nav-pills" aria-label="Filter matches">
      <button class="active" id="btn-live" onclick="setFilter('live', this)">🔴 Live</button>
      <button id="btn-today" onclick="setFilter('today', this)">📅 Today</button>
      <button id="btn-all" onclick="setFilter('all', this)">⚽ All Football</button>
    </nav>

    <!-- Mobile toggle -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" onclick="toggleMenu()">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Mobile nav drawer -->
<nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
  <button class="active" onclick="setFilter('live', this); closeMenu()">🔴 Live Now</button>
  <button onclick="setFilter('today', this); closeMenu()">📅 Today's Matches</button>
  <button onclick="setFilter('all', this); closeMenu()">⚽ All Football</button>
</nav>

<main>
  <!-- Video Player -->
  <section id="player-section" aria-label="Match player">
    <div class="player-header">
      <div class="player-match-title" id="player-title">Match</div>
      <button class="player-close" onclick="closePlayer()" aria-label="Close player">✕ Close</button>
    </div>
    <div class="player-wrap">
      <div class="player-loading" id="player-loading">
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading stream…</span>
      </div>
      <iframe
        id="main-iframe"
        allowfullscreen
        allow="autoplay; fullscreen"
        title="Match stream"
        onload="document.getElementById('player-loading').style.display='none'"
      ></iframe>
    </div>
    <div class="stream-tabs" id="stream-tabs" role="tablist" aria-label="Available streams"></div>
  </section>

  <!-- Match grid -->
  <div class="section-title" id="section-label" aria-live="polite">Live Matches</div>
  <div class="matches-grid" id="matches-grid" aria-live="polite">
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
  </div>
</main>

<footer>
  Powered by <a href="https://streamed.pk" target="_blank" rel="noopener">streamed.pk</a> API &mdash; For personal use only.
</footer>

<script>
  /* ─── Config ─────────────────────────────────────────── */
  const BASE = 'https://streamed.pk/api';
  const IMG  = 'https://streamed.pk/api/images';
  let currentFilter  = 'live';
  let currentStreams  = [];
  let currentMatch   = null;

  /* ─── Mobile menu ────────────────────────────────────── */
  function toggleMenu() {
    const nav  = document.getElementById('mobile-nav');
    const btn  = document.getElementById('menu-toggle');
    const open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    btn.querySelector('i').className = open ? 'ti ti-x' : 'ti ti-menu-2';
  }
  function closeMenu() {
    const nav = document.getElementById('mobile-nav');
    const btn = document.getElementById('menu-toggle');
    nav.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    btn.querySelector('i').className = 'ti ti-menu-2';
  }

  /* Sync mobile nav active state with desktop */
  function syncMobileNav(filter) {
    document.querySelectorAll('.mobile-nav button').forEach((b, i) => {
      const map = ['live','today','all'];
      b.classList.toggle('active', map[i] === filter);
    });
  }

  /* ─── Helpers ────────────────────────────────────────── */
  function initials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function isLive(match) {
    const now = Date.now();
    return now >= match.date && now <= match.date + 2 * 60 * 60 * 1000;
  }

  /* ─── API ────────────────────────────────────────────── */
  async function fetchMatches(filter) {
    const ep = filter === 'live' ? 'live' : filter === 'today' ? 'all-today' : 'football';
    try {
      const r = await fetch(`${BASE}/matches/${ep}`);
      if (!r.ok) throw new Error();
      let data = await r.json();
      if (filter === 'all') data = data.filter(m => m.category === 'football');
      return data;
    } catch { return []; }
  }

  async function loadStreams(match) {
    if (!match.sources?.length) return [];
    const results = [];
    for (const src of match.sources.slice(0, 3)) {
      try {
        const r = await fetch(`${BASE}/stream/${src.source}/${src.id}`);
        if (!r.ok) continue;
        const streams = await r.json();
        if (Array.isArray(streams)) results.push(...streams);
      } catch {}
    }
    return results;
  }

  /* ─── Rendering ──────────────────────────────────────── */
  function renderBadge(badge, name) {
    if (badge) {
      return `<img class="team-badge" src="${IMG}/badge/${badge}.webp" alt="${name || ''}"
                   onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
              <div class="team-badge-placeholder" style="display:none">${initials(name)}</div>`;
    }
    return `<div class="team-badge-placeholder">${initials(name)}</div>`;
  }

  function renderCard(match) {
    const live     = isLive(match);
    const home     = match.teams?.home;
    const away     = match.teams?.away;
    const homeName = home?.name || match.title?.split(' vs ')[0] || 'Home';
    const awayName = away?.name || match.title?.split(' vs ')[1] || 'Away';
    const encoded  = JSON.stringify(match).replace(/"/g, '&quot;');
    const status   = live
      ? `<span class="card-status status-live">● LIVE</span>`
      : `<span class="card-status status-soon">${formatTime(match.date)}</span>`;

    return `
      <div class="match-card ${live ? 'is-live' : ''}" onclick="openMatch(${encoded})" role="article" tabindex="0"
           onkeydown="if(event.key==='Enter')openMatch(${encoded})"
           aria-label="${homeName} vs ${awayName}">
        <div class="card-top">
          <span class="card-competition">${match.category || 'Football'}</span>
          ${status}
        </div>
        <div class="teams-row">
          <div class="team">
            ${renderBadge(home?.badge, homeName)}
            <div class="team-name">${homeName}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="team">
            ${renderBadge(away?.badge, awayName)}
            <div class="team-name">${awayName}</div>
          </div>
        </div>
        <button class="watch-btn" onclick="event.stopPropagation();openMatch(${encoded})" aria-label="Watch ${homeName} vs ${awayName}">
          <i class="ti ti-player-play" aria-hidden="true"></i> Watch Now
        </button>
      </div>`;
  }

  /* ─── Player ─────────────────────────────────────────── */
  async function openMatch(match) {
    currentMatch = match;
    const ps      = document.getElementById('player-section');
    const title   = document.getElementById('player-title');
    const iframe  = document.getElementById('main-iframe');
    const loading = document.getElementById('player-loading');
    const tabs    = document.getElementById('stream-tabs');

    title.textContent = match.title || 'Match';
    iframe.src        = '';
    loading.style.display  = 'flex';
    loading.innerHTML = '<div class="spinner"></div><span>Loading stream…</span>';
    tabs.innerHTML    = '<span style="color:var(--muted);font-size:12px">Loading streams…</span>';
    ps.className      = 'visible';
    ps.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const streams = await loadStreams(match);
    currentStreams = streams;
    tabs.innerHTML = '';

    if (!streams.length) {
      tabs.innerHTML = '<span style="color:var(--muted);font-size:12px">No streams available yet. Check back when the match goes live.</span>';
      loading.innerHTML = '<div style="color:var(--muted);font-size:14px;text-align:center">No stream available</div>';
      return;
    }

    streams.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className   = 'stream-tab' + (i === 0 ? ' active' : '');
      btn.role        = 'tab';
      btn.setAttribute('aria-selected', i === 0);
      btn.innerHTML   = `Stream ${s.streamNo || i + 1} · ${s.language || 'Unknown'}${s.hd ? '<span class="hd-dot" title="HD"></span>' : ''}`;
      btn.onclick     = () => {
        tabs.querySelectorAll('.stream-tab').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        loadStream(s.embedUrl);
      };
      tabs.appendChild(btn);
    });

    loadStream(streams[0].embedUrl);
  }

  function loadStream(url) {
    const iframe  = document.getElementById('main-iframe');
    const loading = document.getElementById('player-loading');
    loading.style.display = 'flex';
    loading.innerHTML = '<div class="spinner"></div><span>Loading stream…</span>';
    iframe.src = url;
  }

  function closePlayer() {
    const ps = document.getElementById('player-section');
    ps.className = '';
    document.getElementById('main-iframe').src = '';
  }

  /* ─── Filter ─────────────────────────────────────────── */
  async function setFilter(filter, btn) {
    // Sync desktop buttons
    document.querySelectorAll('.nav-pills button').forEach(b => b.classList.remove('active'));
    const map = { live: 'btn-live', today: 'btn-today', all: 'btn-all' };
    const target = document.getElementById(map[filter]);
    if (target) target.classList.add('active');

    // Sync clicked button (works for both desktop & mobile)
    if (btn && !btn.closest('.nav-pills')) {
      document.querySelectorAll('.nav-pills button').forEach(b => b.classList.remove('active'));
      if (target) target.classList.add('active');
    }
    syncMobileNav(filter);

    currentFilter = filter;
    const labels = { live: 'Live Matches', today: "Today's Matches", all: 'All Football Matches' };
    document.getElementById('section-label').textContent = labels[filter];

    const grid = document.getElementById('matches-grid');
    grid.innerHTML = '<div class="skel-card"></div>'.repeat(6);

    const matches = await fetchMatches(filter);

    if (!matches.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="ti ti-ball-football" aria-hidden="true"></i>
          <p>No matches found right now.<br>Try "Today" or "All Football".</p>
        </div>`;
      return;
    }

    grid.innerHTML = matches.slice(0, 24).map(renderCard).join('');
  }

  // Boot
  setFilter('live', document.getElementById('btn-live'));
</script>
</body>
</html>
